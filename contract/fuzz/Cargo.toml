[package]
name = "contract-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.3", features = ["derive"] }
libfuzzer-sys = "0.4"

[lib]
path = "invariants/mod.rs"

[[bin]]
name = "stateful_sequence"
path = "fuzz_targets/stateful_sequence.rs"
test = false
doc = false
bench = false

# Keep this cargo-fuzz package independent from the parent contract workspace.
[workspace]
members = ["."]
