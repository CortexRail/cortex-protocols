[workspace]
resolver = "2"
members = [
  "contracts/marketplace",
  "contracts/micropayments",
  "contracts/agent_registry",
]

[workspace.dependencies]
soroban-sdk = "22.0.0"
# Pinned: soroban-env-host's `>=2.0.0` would otherwise resolve to
# ed25519-dalek 3.x, which requires rand_core 0.10's DerefMut-gated `TryRng`
# and fails to compile.
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# wasm-pack compatible release profile
[profile.wasm-release]
inherits = "release"
opt-level = "s"
